<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FB923C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDBA74;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 圆角矩形背景 -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- 背景装饰网格 -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1" fill="none">
    <line x1="128" y1="128" x2="128" y2="384"/>
    <line x1="256" y1="128" x2="256" y2="384"/>
    <line x1="384" y1="128" x2="384" y2="384"/>
    <line x1="128" y1="256" x2="384" y2="256"/>
  </g>
  
  <!-- 温度波形曲线 - 主曲线 -->
  <path d="M 80 280 
           C 120 280, 140 200, 180 200
           C 220 200, 240 320, 280 320
           C 320 320, 340 160, 380 160
           C 420 160, 432 240, 432 240" 
        fill="none" 
        stroke="url(#waveGradient)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  
  <!-- 数据点标记 -->
  <circle cx="180" cy="200" r="12" fill="#F97316" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="280" cy="320" r="12" fill="#FB923C" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="380" cy="160" r="14" fill="#EA580C" stroke="#FFFFFF" stroke-width="3" filter="url(#glow)"/>
  
  <!-- 数据连接线 -->
  <line x1="180" y1="200" x2="180" y2="380" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="280" y1="320" x2="280" y2="380" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="380" y1="160" x2="380" y2="380" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  
  <!-- 时间轴刻度 -->
  <line x1="80" y1="380" x2="432" y2="380" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="120" cy="380" r="4"/>
    <circle cx="200" cy="380" r="4"/>
    <circle cx="300" cy="380" r="4"/>
    <circle cx="400" cy="380" r="4"/>
  </g>
  
  <!-- 温度计图标 - 左侧装饰 -->
  <g transform="translate(64, 180)">
    <rect x="0" y="0" width="24" height="100" rx="12" ry="12" fill="#FFFFFF" opacity="0.9"/>
    <rect x="6" y="15" width="12" height="70" rx="6" ry="6" fill="url(#waveGradient)"/>
    <circle cx="12" cy="90" r="10" fill="#EA580C"/>
  </g>
  
  <!-- 品牌标识文字区域 -->
  <text x="256" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" opacity="0.9">MTA</text>
</svg>