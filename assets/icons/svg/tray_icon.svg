<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="trayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="trayWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FB923C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆形背景 - 托盘图标建议使用圆形 -->
  <circle cx="32" cy="32" r="28" fill="url(#trayBg)" stroke="#FFFFFF" stroke-width="2" opacity="0.95"/>
  
  <!-- 简化的温度波形 -->
  <path d="M 14 38 
           C 18 38, 20 26, 26 26
           C 32 26, 34 42, 40 42
           C 46 42, 50 22, 50 22" 
        fill="none" 
        stroke="url(#trayWave)" 
        stroke-width="3" 
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- 关键数据点 -->
  <circle cx="26" cy="26" r="3" fill="#F97316" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="40" cy="42" r="3" fill="#FB923C" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="50" cy="22" r="3.5" fill="#EA580C" stroke="#FFFFFF" stroke-width="1"/>
  
  <!-- 温度刻度装饰 -->
  <line x1="12" y1="50" x2="52" y2="50" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>